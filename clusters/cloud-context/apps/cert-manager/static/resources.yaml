apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: cert-manager-cm
    app.kubernetes.io/part-of: cert-manager
data:
  resource.customizations: |
    cert-manager.io/Certificate:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message
                return hs
              end
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message
                return hs
              end
            end
          end
        end

        hs.status = "Progressing"
        hs.message = "Waiting for certificate"
        return hs
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mainissuer
spec:
  acme:
    email: valenmortus@protonmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: issuer-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-valentinus.dev
  namespace: traefik
spec:
  secretName: wildcard-valentinus.dev-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "adguard-home-k8s,radicale-k8s,maddy-k8s"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "adguard-home-k8s,radicale-k8s,maddy-k8s"
  dnsNames:
    - valentinus.dev
    - '*.valentinus.dev'
  issuerRef:
    name: mainissuer
    kind: ClusterIssuer
