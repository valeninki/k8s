---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  destination:
    namespace: traefik
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: 'https://traefik.github.io/charts'
    targetRevision: '*'
    chart: traefik
    helm:
      parameters:
        - name: deployment.replicas
          value: "1"
        - name: deployment.revisionHistoryLimit
          value: "0"
        - name: ports.websecure.hostPort
          value: "443"
        - name: ingressClass.enabled
          value: "true"
        - name: ingressClass.isDefaultClass
          value: "true"
        - name: service.enabled
          value: "false"
        - name: tlsStore.default.defaultCertificate.secretName
          value: wildcard-valentinus.dev-tls
      values: |
        ports:
          ssh:
            port: 2222
            expose:
              default: true
            exposedPort: 2222
            protocol: TCP
        nodeSelector:
          kubernetes.io/hostname: m1
        tolerations:
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        additionalArguments:
          - --entrypoints.name.http3
          - --providers.kubernetescrd.allowCrossNamespace=true
          - --providers.kubernetescrd.allowExternalNameServices=true
          - --serverstransport.insecureskipverify=true
          #- --entryPoints.web.forwardedHeaders.insecure
          #- --log.level=DEBUG
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
