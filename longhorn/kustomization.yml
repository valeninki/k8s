# Out-of-band Secret bootstrap (not applied by Flux).
# Copy each .*.env.example to the same name without .example, fill it in,
# then run: kubectl apply -k longhorn/
secretGenerator:
  # Longhorn references this name directly from defaultBackupStore.
  - name: cluster-key
    namespace: longhorn-system
    envs:
      - .garage-creds.env
    options:
      disableNameSuffixHash: true
