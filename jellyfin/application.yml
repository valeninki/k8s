apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  destination:
    namespace: nextcloud-k8s
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: jellyfin
    repoURL: https://jellyfin.github.io/jellyfin-helm
    targetRevision: '2.*'
    helm:
      values: |
        podSecurityContext:
          runAsUser: 33
          runAsGroup: 33
          fsGroup: 33
        
        nodeSelector:
          kubernetes.io/hostname: w1
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
          
        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            size: 3Gi
          media:
            enabled: true
            existingClaim: nextcloud-nextcloud
            mountPath: /mnt/Music
            subPath: data/valentinus/files/Music
            readOnly: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
