apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  destination:
    namespace: nextcloud-k8s
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: jellyfin
    repoURL: https://jellyfin.github.io/jellyfin-helm
    targetRevision: '3.*'
    helm:
      values: |
        podSecurityContext:
          runAsUser: 33
          runAsGroup: 33
          fsGroup: 33
        
        nodeSelector:
          kubernetes.io/hostname: w1

        # The config PVC contains Jellyfin's SQLite database, so never run two
        # Jellyfin versions against it during a rolling update.
        deploymentStrategy:
          type: Recreate

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

        # Jellyfin binds its HTTP port before its /health endpoint is ready.
        # Gate liveness and readiness on the actual health endpoint instead.
        startupProbe:
          tcpSocket: null
          httpGet:
            path: /health
            port: http
          # Avoid the brief healthy response exposed before startup tasks begin.
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30

        # Startup can take more than a minute while plugins and the library load.
        livenessProbe:
          initialDelaySeconds: 90

        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            size: 3Gi
          media:
            enabled: true
            existingClaim: nextcloud-nextcloud
            mountPath: /mnt/Music
            subPath: data/valentinus/files/Music
            readOnly: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
