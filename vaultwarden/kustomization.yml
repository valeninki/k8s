# Out-of-band Secret bootstrap (not applied by Flux).
# Copy each .*.env.example to the same name without .example, fill it in,
# then run: kubectl apply -k vaultwarden/
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: vaultwarden-postgresql
    namespace: vaultwarden-k8s
    envs:
      - ./.db-secret.env