# Out-of-band Secret bootstrap (not applied by Flux).
# Copy each .*.env.example to the same name without .example, fill it in,
# then run: kubectl apply -k nextcloud/
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: nextcloud-app-secret
    namespace: nextcloud-k8s
    envs:
      - ./.app-secret.env
  - name: nextcloud-db-secret
    namespace: nextcloud-k8s
    envs:
      - ./.db-secret.env
