# Out-of-band Secret bootstrap (not applied by Flux).
# Copy each .*.env.example to the same name without .example, fill it in,
# then run: kubectl apply -k commafeed/
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: commafeed-postgresql
    namespace: commafeed-k8s
    envs:
      - ./.db-secret.env
