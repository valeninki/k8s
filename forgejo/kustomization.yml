# Out-of-band Secret bootstrap (not applied by Flux).
# Copy each .*.env.example to the same name without .example, fill it in,
# then run: kubectl apply -k forgejo/
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: forgejo-admin-secret
    namespace: forgejo-k8s
    envs:
      - ./.admin-secret.env
  - name: db-secret
    namespace: forgejo-k8s
    envs:
      - ./.db-secret.env
