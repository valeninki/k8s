resources:
  - namespace.yml
  - ingressroute.yml
  - application.yml
  - database.yml
  - runner-k8s-rbac.yml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: forgejo-admin-secret
    namespace: forgejo-k8s
    envs:
      - ./.admin-secret.env
  - name: db-secret
    namespace: forgejo-k8s
    envs:
      - ./.db-secret.env
