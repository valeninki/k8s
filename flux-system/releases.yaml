apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: flux-system
spec:
  interval: 1h
  suspend: false
  releaseName: kured
  targetNamespace: kured
  chart:
    spec:
      chart: kured
      version: 6.1.0
      sourceRef:
        kind: HelmRepository
        name: kured
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    configuration:
      startTime: "04:00"
      endTime: "06:00"
      timeZone: Europe/Istanbul
      rebootDays:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      period: 60m
      alertFilterRegex:
        target:
          - .*
    prometheus:
      metrics:
        enabled: true
---
