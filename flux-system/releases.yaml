apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  interval: 1h
  suspend: false
  releaseName: nextcloud
  targetNamespace: nextcloud-k8s
  chart:
    spec:
      chart: nextcloud
      version: 9.2.5
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    nextcloud:
      existingSecret:
        enabled: true
        secretName: nextcloud-app-secret
        usernameKey: nextcloud_admin_username
        passwordKey: nextcloud_admin_password
      host: cloud.valentinus.dev
      extraInitContainers:
        - name: fix-subpath-directories
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p /pv/html /pv/data /pv/config /pv/custom_apps /pv/themes && chown -R 33:33 /pv/"]
          volumeMounts:
            - name: nextcloud-main
              mountPath: /pv
      configs:
        custom.config.php: |
          <?php
          $CONFIG = array (
            'trusted_domains' =>
            array (
              0 => 'cloud.valentinus.dev',
            ),
            'overwrite.cli.url' => 'https://cloud.valentinus.dev',
            'overwriteprotocol' => 'https',
            'default_phone_region' => 'TR',
            'trusted_proxies' =>
            array (
              0 => '127.0.0.1',
            ),
            'maintenance_window_start' => 1,
          );
      phpConfigs:
        zz-nc-custom.ini: |-
          memory_limit = 512M
          upload_max_filesize = 2G
          post_max_size = 2G
          max_execution_time = 300
          file_uploads = On
          allow_url_fopen = On
    postgresql:
      enabled: true
      primary:
        nodeSelector:
          kubernetes.io/hostname: w1
        persistence:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
      global:
        postgresql:
          auth:
            existingSecret: nextcloud-db-secret
            secretKeys:
              adminPasswordKey: nextcloud_db_admin_password
              userPasswordKey: nextcloud_db_password
    nodeSelector:
      kubernetes.io/hostname: w1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2500Mi
    cronjob:
      enabled: true
    externalDatabase:
      enabled: true
      existingSecret:
        enabled: true
        secretName: nextcloud-db-secret
        passwordKey: nextcloud_db_password
        usernameKey: nextcloud_db_username
      type: postgresql
    image:
      flavor: fpm
    internalDatabase:
      enabled: false
    nginx:
      enabled: true
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 40Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: flux-system
spec:
  interval: 1h
  suspend: true
  releaseName: forgejo
  targetNamespace: forgejo-k8s
  chartRef:
    kind: OCIRepository
    name: forgejo
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    nodeSelector:
      kubernetes.io/hostname: w2
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
    gitea:
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__DB_TYPE
          value: postgres
        - name: FORGEJO__DATABASE__HOST
          value: forgejo-db-rw.forgejo-k8s.svc.cluster.local:5432
        - name: FORGEJO__DATABASE__NAME
          value: forgejo
        - name: FORGEJO__DATABASE__USER
          value: forgejo
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: FORGEJO__SERVER__ROOT_URL
          value: https://git.valentinus.dev
        - name: FORGEJO__SERVER__DOMAIN
          value: git.valentinus.dev
        - name: FORGEJO__SECURITY__GLOBAL_TWO_FACTOR_REQUIREMENT
          value: all
        - name: FORGEJO__SERVER__SSH_DOMAIN
          value: git.valentinus.dev
      config:
        APP_NAME: "Forgejo: Valen's Private Git Instance."
        repository:
          ROOT: /data/git/gitea-repositories
        repository.pull-request:
          WORK_IN_PROGRESS_PREFIXES: "WIP:,[WIP]:"
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
      admin:
        existingSecret: forgejo-admin-secret
    postgresql-ha:
      enabled: false
    valkey-cluster:
      enabled: false
    valkey:
      enabled: false
    postgresql:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
---
