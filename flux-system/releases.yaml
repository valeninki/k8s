apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-reflector
  namespace: flux-system
spec:
  interval: 1h
  suspend: false
  releaseName: kubernetes-reflector
  targetNamespace: kubernetes-reflector
  chart:
    spec:
      chart: reflector
      version: 10.0.60
      sourceRef:
        kind: HelmRepository
        name: emberstack
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    cron:
      schedule: "*/15 * * * *"
