apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  suspend: false
  releaseName: traefik
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: 41.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    ports:
      ssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        hostPort: 2222
        protocol: TCP
      websecure:
        hostPort: 443
    nodeSelector:
      kubernetes.io/hostname: m1
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    additionalArguments:
      - --entrypoints.name.http3
      - --providers.kubernetescrd.allowCrossNamespace=true
      - --providers.kubernetescrd.allowExternalNameServices=true
      - --serverstransport.insecureskipverify=true
    deployment:
      replicas: 1
      revisionHistoryLimit: 0
    ingressClass:
      enabled: true
      isDefaultClass: true
    service:
      enabled: false
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-valentinus.dev-tls
---
