apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commafeed
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  suspend: false
  dependsOn:
    - name: longhorn
    - name: traefik
  releaseName: commafeed
  targetNamespace: commafeed-k8s
  chart:
    spec:
      chart: commafeed
      version: 8.2.0
      sourceRef:
        kind: HelmRepository
        name: mtaha
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    main:
      options:
        publicUrl: rss.valentinus.dev
    postgresql:
      secret:
        autoCreate: kustomize
