# Pinned SSH host key of the in-cluster Forgejo (/data/ssh/gitea.rsa.pub),
# used by the bot CronJobs instead of trusting ssh-keyscan on every run.
# Update it if the Forgejo host key is ever regenerated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-ssh-known-hosts
  namespace: forgejo-k8s
data:
  known_hosts: |
    forgejo-ssh.forgejo-k8s.svc.cluster.local ssh-rsa 
