apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-k8s
data:
  config.yaml: |
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://node:20-bookworm"
        - "docker:docker://docker:dind"
        - "k8s-dind:docker://node:20-bookworm"
    cache:
      enabled: false
    container:
      network: ""
      # Job containers are unprivileged, so jobs on the "docker" label
      # (docker:dind image) cannot start a nested Docker daemon themselves.
      privileged: false
      # dind creates job containers under the host cgroup root
      # (/docker/<id>), outside this pod's cgroup, so the pod's resource
      # limits do NOT cap jobs. Limit every job container directly; keep this
      # within the dind sidecar's memory request so the node reservation
      # still covers it.
      # --init runs tini as PID 1 so orphaned processes are reaped; the
      # default `tail -f /dev/null` PID 1 leaves them as zombies forever.
      options: "--init --memory=4g --memory-swap=4g --cpus=1.5"
      docker_host: "-"
      valid_volumes: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo-k8s
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-k8s
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      # CI jobs (Rust builds) can use several GiB of memory. Never co-locate
      # the runner with Forgejo or its Postgres: on 2026-11-08 a job on the
      # same node thrashed it until Postgres was OOM-killed and Forgejo went
      # down. If no node qualifies, the runner stays Pending instead.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values: [forgejo, forgejo-db]
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.2.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /data
              until [ -s /certs/client/ca.pem ] && [ -s /certs/client/cert.pem ]; do sleep 2; done
              # Retry until Forgejo is reachable (e.g. on a fresh bootstrap
              # where Forgejo starts in the same layer) instead of crashing.
              if [ ! -s /data/.runner ]; then
                until forgejo-runner register --no-interactive --config /config/config.yaml \
                  --instance http://forgejo-http.forgejo-k8s.svc.cluster.local:3000 \
                  --token "$RUNNER_TOKEN" --name k8s-dind-runner-1 \
                  --labels ubuntu-latest:docker://node:20-bookworm,docker:docker://docker:dind,k8s-dind:docker://node:20-bookworm; do
                  echo "runner registration failed, retrying in 10s" >&2
                  sleep 10
                done
              fi
              exec forgejo-runner daemon --config /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: token
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
        - name: dind
          image: docker:29.9.3-dind
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                # Every 30 min prune unused Docker objects older than 2h so
                # docker-storage does not grow until the sizeLimit evicts the pod.
                command:
                  - /bin/sh
                  - -c
                  - (while true; do sleep 1800; docker system prune -af --filter "until=2h" --volumes || true; done) </dev/null >/proc/1/fd/1 2>/proc/1/fd/2 &
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: docker-storage
              mountPath: /var/lib/docker
          # Jobs run inside this sidecar, so it carries the job's memory and
          # disk. Nix flake checks compile Rust (clippy + tests) here; a single
          # rustc peaks around 3.1 GB RSS, plus the Nix evaluator alongside.
          # Request equals limit so the scheduler reserves the memory instead
          # of overcommitting the node (the nodes have 7.6Gi each).
          resources:
            requests: {cpu: 250m, memory: 4Gi}
            limits: {cpu: "1500m", memory: 4Gi}
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: certs
          emptyDir: {}
        - name: docker-storage
          emptyDir:
            # Holds job images and the job container's writable layer
            # (including a fresh /nix/store and cargo target dirs). Going over
            # the limit evicts the runner pod mid-job; keep it below the node's
            # free disk minus the kubelet's 10% nodefs eviction threshold.
            sizeLimit: 15Gi
