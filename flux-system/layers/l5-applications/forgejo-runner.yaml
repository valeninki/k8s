apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-k8s
data:
  config.yaml: |
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://node:20-bookworm"
        - "docker:docker://docker:dind"
        - "k8s-dind:docker://node:20-bookworm"
    cache:
      enabled: false
    container:
      network: ""
      # Job containers are unprivileged, so jobs on the "docker" label
      # (docker:dind image) cannot start a nested Docker daemon themselves.
      privileged: false
      docker_host: "-"
      valid_volumes: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo-k8s
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-k8s
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.2.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /data
              until [ -s /certs/client/ca.pem ] && [ -s /certs/client/cert.pem ]; do sleep 2; done
              # Retry until Forgejo is reachable (e.g. on a fresh bootstrap
              # where Forgejo starts in the same layer) instead of crashing.
              if [ ! -s /data/.runner ]; then
                until forgejo-runner register --no-interactive --config /config/config.yaml \
                  --instance http://forgejo-http.forgejo-k8s.svc.cluster.local:3000 \
                  --token "$RUNNER_TOKEN" --name k8s-dind-runner-1 \
                  --labels ubuntu-latest:docker://node:20-bookworm,docker:docker://docker:dind,k8s-dind:docker://node:20-bookworm; do
                  echo "runner registration failed, retrying in 10s" >&2
                  sleep 10
                done
              fi
              exec forgejo-runner daemon --config /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: token
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
        - name: dind
          image: docker:29.9.3-dind
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                # Every 30 min prune unused Docker objects older than 2h so
                # docker-storage does not grow until the sizeLimit evicts the pod.
                command:
                  - /bin/sh
                  - -c
                  - (while true; do sleep 1800; docker system prune -af --filter "until=2h" --volumes || true; done) </dev/null >/proc/1/fd/1 2>/proc/1/fd/2 &
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: docker-storage
              mountPath: /var/lib/docker
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1500m", memory: 2Gi}
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: certs
          emptyDir: {}
        - name: docker-storage
          emptyDir:
            sizeLimit: 8Gi
