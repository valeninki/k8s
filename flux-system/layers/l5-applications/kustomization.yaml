apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - victoria-metrics.yaml
  - attic.yaml
  - adguard-home.yaml
  - adguard-home-netpol.yaml
  - commafeed.yaml
  - nextcloud.yaml
  - forgejo.yaml
  - forgejo-runner.yaml
  - flake-update-cronjob.yaml
  - flake-update-deps-cronjob.yaml
  - shark-renovate-cronjob.yaml
  - shark-nixpkgs-updater-cronjob.yaml
  - forgejo-ssh-known-hosts.yaml
  - jellyfin.yaml
  - vaultwarden.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: forgejo-theme-catppuccin
    namespace: forgejo-k8s
    files:
      - theme-catppuccin-mocha-peach.css
