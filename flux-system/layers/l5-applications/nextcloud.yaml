apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  interval: 1h
  timeout: 20m
  suspend: false
  dependsOn:
    - name: longhorn
    - name: traefik
  releaseName: nextcloud
  targetNamespace: nextcloud-k8s
  chart:
    spec:
      chart: nextcloud
      version: 9.4.3
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    nextcloud:
      existingSecret:
        enabled: true
        secretName: nextcloud-app-secret
        usernameKey: nextcloud_admin_username
        passwordKey: nextcloud_admin_password
      host: cloud.valentinus.dev
      extraInitContainers:
        - name: fix-subpath-directories
          image: busybox:1.38.0
          command: ["sh", "-c", "mkdir -p /pv/html /pv/data /pv/config /pv/custom_apps /pv/themes && chown -R 33:33 /pv/"]
          volumeMounts:
            - name: nextcloud-main
              mountPath: /pv
      configs:
        custom.config.php: |
          <?php
          $CONFIG = array (
            'trusted_domains' =>
            array (
              0 => 'cloud.valentinus.dev',
            ),
            'overwrite.cli.url' => 'https://cloud.valentinus.dev',
            'overwriteprotocol' => 'https',
            'default_phone_region' => 'TR',
            'trusted_proxies' =>
            array (
              0 => '127.0.0.1',
              // Pod CIDR: Traefik reaches the nginx sidecar from its pod IP.
              1 => '172.16.0.0/16',
            ),
            'maintenance_window_start' => 1,
            'tempdirectory' => '/var/www/html/data/tmp',
            'files.chunked_upload.max_size' => 10485760,
          );
      # With nginx enabled the chart mounts these into /usr/local/etc/php-fpm.d/,
      # which php-fpm only includes as *.conf, so they must use pool syntax.
      phpConfigs:
        zz-nc-custom.conf: |-
          [www]
          php_admin_value[memory_limit] = 512M
          php_admin_value[upload_max_filesize] = 2G
          php_admin_value[post_max_size] = 2G
          php_admin_value[max_execution_time] = 300
          php_admin_flag[file_uploads] = on
          php_admin_flag[allow_url_fopen] = on
          ; /tmp is a 1Gi in-memory emptyDir, too small for 2G uploads.
          php_admin_value[upload_tmp_dir] = /var/www/html/data/tmp
      extraVolumes:
        - name: nextcloud-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      extraVolumeMounts:
        - name: nextcloud-tmp
          mountPath: /tmp
    postgresql:
      enabled: true
      primary:
        nodeSelector:
          kubernetes.io/hostname: w1
        persistence:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
      global:
        postgresql:
          auth:
            existingSecret: nextcloud-db-secret
            secretKeys:
              adminPasswordKey: nextcloud_db_admin_password
              userPasswordKey: nextcloud_db_password
    nodeSelector:
      kubernetes.io/hostname: w1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: 2000m
        memory: 2500Mi
        ephemeral-storage: 4Gi
    cronjob:
      enabled: true
    externalDatabase:
      enabled: true
      existingSecret:
        enabled: true
        secretName: nextcloud-db-secret
        passwordKey: nextcloud_db_password
        usernameKey: nextcloud_db_username
      type: postgresql
    image:
      flavor: fpm
    internalDatabase:
      enabled: false
    nginx:
      enabled: true
      config:
        # Chart default, with the body limit raised to match post_max_size.
        serverBlockCustom: |
          # set max upload size
          client_max_body_size 2G;
          client_body_timeout 300s;
          fastcgi_buffers 64 4K;
          fastcgi_read_timeout 3600s;
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 40Gi
