apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  suspend: false
  dependsOn:
    - name: nextcloud
    - name: traefik
  releaseName: jellyfin
  targetNamespace: nextcloud-k8s
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    podSecurityContext:
      runAsUser: 33
      runAsGroup: 33
      fsGroup: 33
    nodeSelector:
      kubernetes.io/hostname: w1
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    startupProbe:
      tcpSocket: null
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    livenessProbe:
      initialDelaySeconds: 90
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 3Gi
      media:
        enabled: true
        existingClaim: nextcloud-nextcloud
        mountPath: /mnt/Music
        subPath: data/valentinus/files/Music
        readOnly: true
