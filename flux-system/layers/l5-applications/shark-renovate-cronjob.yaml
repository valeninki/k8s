apiVersion: batch/v1
kind: CronJob
metadata:
  name: shark-renovate
  namespace: forgejo-k8s
spec:
  schedule: "*/30 * * * *"
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: w2
          securityContext:
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: flux-cli
              image: ghcr.io/fluxcd/flux-cli:v2.10.1@sha256:0253c5c82a8d98858f33dfe722afdfde83aa17dce05571f5846c26ea40d71b50
              command:
                - /bin/sh
                - -ec
                - cp /usr/local/bin/flux /tools/flux && chmod 0555 /tools/flux
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 65534
                runAsUser: 65534
              volumeMounts:
                - name: flux-tools
                  mountPath: /tools
          containers:
            - name: renovate
              image: renovate/renovate:44.260.3@sha256:3a3afa18062aa0514f32cd636cdd08f4b6c68cb62e699e5729511d1127ad7b05
              args:
                - valeninki/k8s
              env:
                - name: RENOVATE_PLATFORM
                  value: forgejo
                - name: RENOVATE_ENDPOINT
                  value: http://forgejo-http.forgejo-k8s.svc.cluster.local:3000/api/v1/
                # Clone and push through the in-cluster endpoint too, instead of
                # the public clone URL (hairpins via the external IP and has failed
                # with gnutls_handshake errors).
                - name: RENOVATE_GIT_URL
                  value: endpoint
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: shark-renovate-token
                      key: token
                - name: RENOVATE_GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: shark-github-token
                      key: token
                - name: RENOVATE_GIT_AUTHOR
                  value: Shark <shark@valentinus.dev>
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_PLATFORM_AUTOMERGE
                  value: "false"
                - name: RENOVATE_CACHE_DIR
                  value: /tmp/renovate/cache
                - name: RENOVATE_BINARY_SOURCE
                  value: global
                - name: PATH
                  value: /opt/renovate-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                - name: RENOVATE_LOG_LEVEL
                  value: info
              resources:
                requests:
                  cpu: 250m
                  ephemeral-storage: 1Gi
                  memory: 512Mi
                limits:
                  cpu: "2"
                  ephemeral-storage: 4Gi
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: flux-tools
                  mountPath: /opt/renovate-tools
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
            - name: flux-tools
              emptyDir: {}
