apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  suspend: false
  dependsOn:
    - name: longhorn
    - name: traefik
  releaseName: victoria-metrics
  targetNamespace: metrics-k8s
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.87.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  install:
    disableHooks: true
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    grafana:
      plugins: []
      persistence:
        enabled: true
        size: 1Gi
      admin:
        existingSecret: vm-grafana
        userKey: admin-user
        passwordKey: admin-pass
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 1Gi
    alertmanager:
      name: alertmanager
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "14"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
    vmagent:
      enabled: true
      spec:
        scrapeInterval: 60s
        selectAllByDefault: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: true
    defaultRules:
      enabled: true
