apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  suspend: false
  dependsOn:
    - name: longhorn
    - name: traefik
    - name: cert-manager
  releaseName: adguard-home
  targetNamespace: adguard-home-k8s
  chart:
    spec:
      chart: adguard-home
      version: 4.0.12
      sourceRef:
        kind: HelmRepository
        name: mtaha
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: adguard-home-main
              namespace: adguard-home-k8s
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: adguard-home-main
                namespace: adguard-home-k8s
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
  values:
    nodeSelector:
      kubernetes.io/hostname: w2
    main:
      tls:
        secretName: wildcard-valentinus.dev-tls
        serverName: dns.valentinus.dev
      podCIDR: 172.16.0.0/16
