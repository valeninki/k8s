apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  suspend: false
  dependsOn:
    - name: longhorn
    - name: traefik
    - name: cert-manager
  releaseName: adguard-home
  targetNamespace: adguard-home-k8s
  chart:
    spec:
      chart: adguard-home
      version: 4.0.12
      sourceRef:
        kind: HelmRepository
        name: mtaha
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: adguard-home-main
              namespace: adguard-home-k8s
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: adguard-home-main
                namespace: adguard-home-k8s
              spec:
                template:
                  spec:
                    initContainers:
                      - name: adguard-home-main-dns-rewrite-loader
                        image: mikefarah/yq:latest
                        command:
                          - sh
                          - -ec
                          - |
                            config=/opt/adguardhome/conf/AdGuardHome.yaml
                            if [ ! -f "$config" ]; then
                              echo "AdGuard Home is not initialized; DNS rewrite will be applied on its next restart"
                              exit 0
                            fi
                            yq eval '
                              .dns.rewrites = (
                                (.dns.rewrites // [])
                                | map(select(.domain != "git.valentinus.dev"))
                                + [{"domain": "git.valentinus.dev", "answer": "172.16.20.50", "enabled": true}]
                              )
                            ' "$config" > /tmp/AdGuardHome.yaml.new
                            mv /tmp/AdGuardHome.yaml.new "$config"
                        volumeMounts:
                          - name: adguard-home-data
                            mountPath: /opt/adguardhome/conf
                            subPath: conf
  values:
    nodeSelector:
      kubernetes.io/hostname: w2
    main:
      tls:
        secretName: wildcard-valentinus.dev-tls
        serverName: dns.valentinus.dev
      podCIDR: 172.16.0.0/16
