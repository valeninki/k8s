apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  suspend: false
  dependsOn:
    - name: longhorn
    - name: traefik
  releaseName: vaultwarden
  targetNamespace: vaultwarden-k8s
  chart:
    spec:
      chart: vaultwarden
      version: 7.3.4
      sourceRef:
        kind: HelmRepository
        name: mtaha
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    postgresql:
      secret:
        autoCreate: kustomize
