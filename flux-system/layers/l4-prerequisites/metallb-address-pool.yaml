# No L2Advertisement/BGPAdvertisement exists on purpose: the LoadBalancer IPs
# are only used as stable in-cluster addresses, and public traffic arrives via
# the Traefik service externalIPs/hostPorts on m1. This range is reserved in
# Calico IPAM by calico-ipreservation.yaml.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
spec:
  addresses:
    - 172.16.20.0/24
  autoAssign: true
  avoidBuggyIPs: false
