apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: l4-prerequisites
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  # wait: true health-checks every applied object (healthChecks would be ignored).
  wait: true
  prune: false
  dependsOn:
    - name: l2-sops-secrets
    - name: l3-platform
  path: ./flux-system/layers/l4-prerequisites
  sourceRef:
    kind: GitRepository
    name: flux-system
