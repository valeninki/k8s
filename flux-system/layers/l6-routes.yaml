apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: l6-routes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  wait: true
  prune: false
  dependsOn:
    - name: l5-applications
  path: ./flux-system/layers/l6-routes
  sourceRef:
    kind: GitRepository
    name: flux-system
