apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  suspend: false
  dependsOn: []
  releaseName: cert-manager
  targetNamespace: kube-system
  chart:
    spec:
      chart: cert-manager
      version: v1.21.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    disableHooks: true
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    installCRDs: true
