# Public, read-mostly access to the Nix binary cache. Cloudflare proxies this
# hostname and rejects request bodies over 100 MB, so CI pushes through the
# in-cluster Service (attic.attic-k8s.svc.cluster.local) instead.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: attic
  namespace: attic-k8s
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`cache.valentinus.dev`)
      priority: 10
      services:
        - kind: Service
          name: attic
          namespace: attic-k8s
          passHostHeader: true
          port: 80
          scheme: http
  tls:
    domains:
      - main: cache.valentinus.dev
    secretName: wildcard-valentinus.dev-tls
