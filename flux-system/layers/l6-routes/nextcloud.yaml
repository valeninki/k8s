apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud-k8s
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`cloud.valentinus.dev`)
      priority: 10
      middlewares:
        - name: dav-redirect
        - name: hsts-header
      services:
        - kind: Service
          name: nextcloud
          namespace: nextcloud-k8s
          passHostHeader: true
          port: 8080
          scheme: http
  tls:
    domains:
      - main: cloud.valentinus.dev
    secretName: wildcard-valentinus.dev-tls
