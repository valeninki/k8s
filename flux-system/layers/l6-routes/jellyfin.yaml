apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: nextcloud-k8s
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`music.valentinus.dev`)
      priority: 10
      services:
        - kind: Service
          name: jellyfin
          namespace: nextcloud-k8s
          passHostHeader: true
          port: 8096
          scheme: http
  tls:
    domains:
      - main: music.valentinus.dev
    secretName: wildcard-valentinus.dev-tls
