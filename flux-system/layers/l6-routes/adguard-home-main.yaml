apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home-main
  namespace: adguard-home-k8s
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`dns.valentinus.dev`)
      middlewares:
        - name: adguard-home-header
      priority: 10
      services:
        - kind: Service
          name: adguard-home-main
          namespace: adguard-home-k8s
          passHostHeader: true
          port: web-ssl
          scheme: https
  tls:
    domains:
      - main: dns.valentinus.dev
    secretName: wildcard-valentinus.dev-tls
