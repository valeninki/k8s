apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  suspend: false
  dependsOn: []
  releaseName: longhorn
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    disableTakeOwnership: false
    remediation:
      retries: 0
  values:
    global:
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    defaultBackupStore:
      backupTarget: s3://cluster-backup@garage/
      backupTargetCredentialSecret: cluster-key
    preUpgradeChecker:
      jobEnabled: true
    longhornUI:
      replicas: 1
    defaultSettings:
      replicaCount: 2
