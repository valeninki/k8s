apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: l5-applications
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  # wait: true health-checks every applied object (healthChecks would be ignored).
  wait: true
  prune: false
  dependsOn:
    - name: l4-prerequisites
  path: ./flux-system/layers/l5-applications
  sourceRef:
    kind: GitRepository
    name: flux-system
