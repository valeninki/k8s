apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud-k8s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dav-redirect
  namespace: nextcloud-k8s
spec:
  redirectRegex:
    regex: ^/.well-known/(carddav|caldav)
    replacement: /remote.php/dav/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts-header
  namespace: nextcloud-k8s
spec:
  headers:
    stsSeconds: 15552000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-req-buffer
  namespace: nextcloud-k8s
spec:
  buffering:
    maxRequestBodyBytes: 10737418240
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud-k8s
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cloud.valentinus.dev`)
      priority: 10
      middlewares:
        - name: dav-redirect
        - name: hsts-header
      services:
        - kind: Service
          name: nextcloud
          namespace: nextcloud-k8s
          passHostHeader: true
          port: 8080
          scheme: http
  tls:
    domains:
      - main: cloud.valentinus.dev
    secretName: wildcard-valentinus.dev-tls
