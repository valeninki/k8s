# Out-of-band Secret bootstrap (not applied by Flux).
# Copy each .*.env.example to the same name without .example, fill it in,
# then run: kubectl apply -k metrics/
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: vm-grafana
    namespace: metrics-k8s
    envs:
      - ./.grafana-secret.env
